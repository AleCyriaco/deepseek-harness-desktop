name: Build

# Builds the desktop bundles for macOS, Windows and Linux and uploads them as
# workflow artifacts. It never creates or modifies a release.
#
# That separation is deliberate. Publishing used to be wired to `v*` tag
# pushes, but creating a release *creates the tag*, so every publish triggered
# a build that then tried to attach its own bundles to the release that had
# just been published. The run had to be cancelled by hand every single time.
#
# Releasing is now an explicit, verified step — see
# docs/DEVELOPMENT.md#releasing. Bundles produced here are UNSIGNED unless
# signing secrets are configured; see docs/DEVELOPMENT.md#code-signing.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Node version embedded in the portable build. Pinned deliberately: it
  # is the interpreter every portable user will run the harness under, so it
  # should change only as a considered decision.
  EMBEDDED_NODE: v22.22.0

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal)
            slug: macos-universal
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # AppImage is deliberately not built: `linuxdeploy` fails on the
          # 300 MB resource tree the bundle carries. `.deb` and `.rpm` build
          # fine, and the failure used to abort the job before they were
          # collected. See bundle.targets in tauri.conf.json.
          - os: ubuntu-latest
            label: Linux
            slug: linux-x86_64
            args: ''
            rust-targets: ''
          - os: windows-latest
            label: Windows
            slug: windows-x86_64
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install the Tauri CLI
        run: npm ci || npm install

      # The bundle config ships backend/node_modules/ inside the app, so the
      # released build is self-contained and needs no `dsh` on the user's
      # machine. Without this step the resource copy would fail.
      - name: Install the bundled harness runtime
        run: npm run backend:install

      # A tree can install cleanly and still be unusable: v0.1.3 shipped
      # without a peer dependency and only failed on a user's machine. Start
      # the backend here, before it is packed into anything.
      - name: Check the harness runtime actually starts
        run: npm run backend:check

      - name: Build the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No tagName: that is what tells tauri-action to build and stop,
          # rather than reaching for a release.
          args: ${{ matrix.args }}

      # The portable build carries the harness runtime *and* a Node
      # interpreter inside the executable, so the machine it runs on needs
      # nothing at all. That is what the `portable` feature packs in, and why
      # the Node binary has to be fetched before the build.
      - name: Fetch the Node runtime to embed
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/vendor | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/${{ env.EMBEDDED_NODE }}/win-x64/node.exe" `
            -OutFile "src-tauri/vendor/node.exe"
          "embedded Node: $((Get-Item src-tauri/vendor/node.exe).Length / 1MB) MB"

      - name: Build the portable executable
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: cargo build --release --features portable --target-dir target/portable

      - name: Upload the bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/portable/release/dsh-desktop.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
