name: Release

# Builds the desktop bundles for macOS, Windows and Linux and attaches them to
# a draft GitHub Release. Push a `v*` tag to trigger it, then review and
# publish the draft by hand.
#
# Bundles produced here are UNSIGNED unless signing secrets are configured;
# see docs/DEVELOPMENT.md#code-signing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal)
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux
            args: ''
            rust-targets: ''
          - os: windows-latest
            label: Windows
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install the Tauri CLI
        run: npm ci || npm install

      # The bundle config ships backend/node_modules/ inside the app, so the
      # released build is self-contained and needs no `dsh` on the user's
      # machine. Without this step the resource copy would fail.
      - name: Install the bundled harness runtime
        run: npm run backend:install

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DeepSeek Harness Desktop ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/AleCyriaco/deepseek-harness-desktop/blob/main/CHANGELOG.md) for what changed.

            The harness runtime is bundled inside each build, so the only
            requirement on your machine is **Node.js 20 or newer**. The macOS
            build is a universal binary (Apple Silicon and Intel).

            These bundles are unsigned, so macOS quarantines them on first
            launch:

            ```
            xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness Desktop.app"
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
