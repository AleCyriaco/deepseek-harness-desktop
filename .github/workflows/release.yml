name: Release

# Builds the desktop bundles for macOS, Windows and Linux.
#
# Two modes, decided by how the run was started:
#
#   Tag push (`v*`)     build and attach the bundles to a DRAFT GitHub
#                       Release, which you then review and publish by hand.
#   Manual dispatch     build only. The bundles are uploaded as workflow
#                       artifacts and NO release is created or modified, so
#                       this is safe to run against an already-published tag
#                       when you just need one platform's installer.
#
# Bundles produced here are UNSIGNED unless signing secrets are configured;
# see docs/DEVELOPMENT.md#code-signing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal)
            slug: macos-universal
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux
            slug: linux-x86_64
            args: ''
            rust-targets: ''
          - os: windows-latest
            label: Windows
            slug: windows-x86_64
            args: ''
            rust-targets: ''
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install the Tauri CLI
        run: npm ci || npm install

      # The bundle config ships backend/node_modules/ inside the app, so the
      # released build is self-contained and needs no `dsh` on the user's
      # machine. Without this step the resource copy would fail.
      - name: Install the bundled harness runtime
        run: npm run backend:install

      # On a manual run `tagName` is empty, which tells tauri-action to build
      # without creating or touching any release — the guard that keeps a
      # published release safe from an ad-hoc rebuild.
      - name: Build the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('DeepSeek Harness Desktop {0}', github.ref_name) || '' }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/AleCyriaco/deepseek-harness-desktop/blob/main/CHANGELOG.md) for what changed.

            The harness runtime is bundled inside each build, so the only
            requirement on your machine is **Node.js 20 or newer**. The macOS
            build is a universal binary (Apple Silicon and Intel).

            These bundles are unsigned, so macOS quarantines them on first
            launch:

            ```
            xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness Desktop.app"
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # `dsh-desktop.exe` is picked up alongside the installers: with no
      # resources next to it, that same binary is the portable build — it
      # falls through to the `npx` bootstrap and fetches the harness itself.
      - name: Upload the bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/dsh-desktop.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
