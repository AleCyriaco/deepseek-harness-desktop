[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop shell: a Tauri + Rust window around the dsh web GUI"
authors = ["Alexandre Cyriaco"]
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/AleCyriaco/deepseek-harness-desktop"
keywords = ["tauri", "desktop", "deepseek", "webview"]
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
