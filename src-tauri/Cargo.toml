[package]
name = "dsh-desktop"
version = "0.1.5"
description = "DeepSeek Harness desktop shell: a Tauri + Rust window around the dsh web GUI"
authors = ["Alexandre Cyriaco"]
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/AleCyriaco/deepseek-harness-desktop"
keywords = ["tauri", "desktop", "deepseek", "webview"]
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Builds the portable single-executable variant: the harness runtime and a
# Node interpreter are compressed into the binary and unpacked on first run.
# Off by default, because it makes the binary ~100 MB and the build far slower.
portable = ["dep:flate2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"

[dependencies]
# `devtools` is enabled in release too: this window hosts a web UI, and
# without the inspector a client-side failure like "Failed to fetch" cannot be
# diagnosed at all from a shipped build.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
flate2 = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
